---
- name: ⬆️ Pushes Config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: sshd config changed

- name: ⚙️ Allow port
  ansible.builtin.command: "ufw allow {{ sshd_port }}"
  become: true
  register: ssh_ufw_allow
  changed_when: "'Rule added' in ssh_ufw_allow.stdout"

- name: ⚙️ Disallow default ssh ports
  ansible.builtin.command: "ufw deny 22"
  become: true
  register: ssh_ufw_deny
  changed_when: "'Rule updated' in ssh_ufw_deny.stdout"
