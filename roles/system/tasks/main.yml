---
- name: Journald
  ansible.builtin.include_tasks: journald.yml
- name: Create-admins
  ansible.builtin.include_tasks: create-admins.yml

- name: 📂 Creates services path
  ansible.builtin.file:
    state: directory
    path: "{{ services_path }}"
    owner: root
    group: app
    mode: "0751"
  become: true
