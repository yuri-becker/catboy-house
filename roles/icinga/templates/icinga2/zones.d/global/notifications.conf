{% raw %}
object NotificationCommand "universal" {
  command = [ "/usr/bin/universal-icinga-notifier", "notify" ]
  env.CONFIGURATION_DIRECTORY = ConfigDir
  arguments += {
    "--recipient-xmpp" = {
      value = "$user.vars.xmpp$"
      set_if = {{ len(user.vars.xmpp) > 0 }}
    }
    "--icinga-url" = {
      value = IcingaWebUrl
    }
    "--host-display-name" = {
      value = "$host.display_name$"
    }
    "--host-name" = {
      value = "$host.name$"
    }
    "--host-notes" = {
      value = "$host.notes$"
    }
    "--host-output" = {
      value = "$host.output$"
    }
    "--host-state" = {
      value = "$host.state$"
    }
    "--service-display-name" = {
      value = "$service.display_name$"
    }
    "--service-name" = {
      value = "$service.name$"
    }
    "--service-output" = {
      value = "$service.output$"
    }
    "--service-state" = {
      value = "$service.state$"
    }
    "--notification-author" = {
      value = "$notification.author$"
    },
    "--notification-comment" = {
      value = "$notification.comment$"
    },
    "--notification-type" = {
      value = "$notification.type$"
    },
    "--notification-time" = {
      value = "$icinga.long_date_time$"
    }
  }
}


template Notification "universal" {
  command = "universal"

  types = [
    Problem,
    Acknowledgement,
    Recovery,
    Custom,
    FlappingStart,
    FlappingEnd,
  ]

  period = "always"
  user_groups = host.vars.notify.groups
  users = host.vars.notify.users
  interval = 0
}


apply Notification "notification" to Host {
  assign where host.vars.notify
  import "universal"
}

apply Notification "notification" to Service {
  assign where host.vars.notify
  import "universal"
}
{% endraw %}
